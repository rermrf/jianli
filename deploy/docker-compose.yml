name: jianli

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: app
    image: jianli-app:local
    restart: unless-stopped
    volumes:
      - ../config.json:/app/config.json:ro
      - ../data:/app/data
    ports:
      - '8088:8088'
    networks:
      default:
      edge-proxy:
        aliases:
          - jianli-app

networks:
  edge-proxy:
    external: true
