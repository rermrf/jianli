name: jianli

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: app
    image: jianli-app:local
    restart: unless-stopped
    environment:
      AUTH_KEY: ${AUTH_KEY}
    volumes:
      - ../config.json:/app/config.json:ro
      - ../data:/app/data
    ports:
      - '${APP_BIND:-127.0.0.1:8088:8088}'
