name: jianli

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: app
    image: jianli-app:local
    restart: unless-stopped
    environment:
      AUTH_KEY: ${AUTH_KEY}
    volumes:
      - ${APP_CONFIG_PATH}:/app/config.json:ro
      - ${APP_DATA_DIR}:/app/data
    ports:
      - '${APP_BIND:-127.0.0.1:8080:8080}'
